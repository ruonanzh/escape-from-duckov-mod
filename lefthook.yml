# mod repo 维护者 hooks：只校验环境自身，绝不引用 your_mods/
# 用法：仓库维护者本地跑一次 `lefthook install`，之后每次 commit/push 自动执行。
# 注意：这里只跑 reference/example_mod（官方样例），不校验玩家的 mod。

pre-commit:
  commands:
    lint-self-test:
      run: node lint/check_mod.mjs reference/example_mod
      fail_text: FAIL

pre-push:
  commands:
    full-check:
      run: node lint/check_mod.mjs reference/example_mod
      fail_text: FAIL
