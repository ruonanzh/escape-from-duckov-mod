# mod repo 维护者 hooks：只校验环境自身，绝不引用 your_mods/
#
# 注意：mod 校验逻辑已迁到 .pi/extensions/mod-lint.ts（validate_mod 工具，agent 用）。
# 维护者校验 reference/example_mod 的方式：在 pi agent 里调 validate_mod 工具。
#
# ---- pre-commit（只校验环境自身，不碰 your_mods/）----
# 需要本机装了 lefthook 才生效（brew install lefthook / npm i -D lefthook + lefthook install）
# 手跑完整门禁：lefthook run pre-commit --all-files
# 单项命令与运行时要求见 scripts/README.md。
pre-commit:
  parallel: true
  commands:
    probe-tool-parity:
      # data-probe CLI 的参数/action 与 inspect_game_data 工具面必须对齐。
      # 这个错犯过两次（9b26ae5 的 export；后来的 mesh/exact/has/by）⇒ 靠人记不住，改成机器查。
      run: node scripts/check-probe-tool-parity.mjs
    prompt-standard-zh:
      # 中文提示词的规范（情态词、箭头、术语）写在设计仓的 prompt-standard.md 里。
      # 只写在那里就一定会被重新写坏（已经发生过几轮）。能机器判的三条放这里。
      run: node scripts/check-prompt-standard-zh.mjs
    doc-refs:
      # 文档里的链接与路径。踩过：4 份 SKILL 写 `../../docs/mod-kit-api.md`（少一级，指到 .pi/docs/ 去了），
      # 两份 editor README 指向设计仓的文件。机器查一次就不会再漏。
      run: node scripts/check-doc-refs.mjs
    mod-kit-api:
      # 台账里写了不存在的接口。踩过：`CharacterSwap.Install()`（其实是嵌套私有类的，且不需人调）。
      run: node scripts/check-mod-kit-api.mjs
    asset-manifest:
      run: node --experimental-strip-types scripts/check-asset-manifest.mjs
    mod-install-staleness:
      run: node --experimental-strip-types scripts/check-mod-install-staleness.mjs
    mod-config-data:
      run: node --experimental-strip-types scripts/check-mod-config-data.mjs
    character-rig:
      run: node scripts/check-character-rig.mjs
    character-swap:
      run: node scripts/check-character-swap.mjs
    decompile-lib:
      # 测试使用 bun:test，不能用 Node 运行。
      run: bun test --cwd .pi/lib decompile.test.mjs
