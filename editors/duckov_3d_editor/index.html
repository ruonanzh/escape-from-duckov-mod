<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Duckov 3D 编辑器</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none';">
  <style>
    :root { --bg:#eef0f2; --panel:#ffffffdd; --fg:#1a1a1a; --dim:#666; --line:#0002; --accent:#036; }
    html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
      font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",monospace; }
    #view { position:fixed; inset:0; }
    canvas { display:block; }
    #hud { position:fixed; left:10px; top:10px; max-width:420px; background:var(--panel);
      padding:10px 12px; border-radius:8px; box-shadow:0 1px 6px #0002; }
    #hud h1 { margin:0 0 6px; font-size:13px; }
    #hud .row { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; }
    #hud a { color:var(--accent); text-decoration:none; white-space:nowrap; cursor:pointer; }
    #hud a.on { font-weight:700; text-decoration:underline; }
    #hud .dim { color:var(--dim); }
    /* 「物品」+ 尺寸：整块放**右下角**（左上留给标题/视角/提示） */
    #panel { position:fixed; right:10px; bottom:10px; width:230px; background:var(--panel);
      padding:8px; border-radius:8px; box-shadow:0 1px 6px #0002;
      max-height:calc(100vh - 20px); overflow:auto; font-size:12px; }
    #panel h2 { margin:0 0 6px; font-size:12px; }
    #panel label { display:flex; justify-content:space-between; align-items:center; gap:6px; margin:4px 0; }
    /* ⚠️ `div.row` 也要 flex ✗ —— 原来只定义了 `label.row`，于是自定义的 div 行根本没生效 */
    #panel .row { display:flex; flex-wrap:nowrap; align-items:center; gap:5px; margin:5px 0; }
    /* ⚠️ 上面那条 `display:flex` 会**压过** HTML 的 `hidden` 属性 ✗ ——
       `[hidden]` 自带的是 `display:none`，优先级低于类选择器 ✓。
       已踩：选「面部」时 pivot 行和握把行应该隐藏，实际还在屏幕上（探针读到的 hidden 是 true ✓，像素说还在 ✗）。
       因此这里必须把 `[hidden]` 抬到 `!important` ✓。*/
    [hidden] { display: none !important; }
    /* 数字框的上下按钮（浏览器自带）：在 45px 的窄框里会挡住数字 ✗
       —— 缩小它、并把它往右贴，给数字让出位置。用户 2026-10-13 要求。 */
    #panel input[type=number]::-webkit-inner-spin-button {
      /* 高度保持浏览器默认，宽度减半（用户 2026-10-13）。面板宽到 230 后不用再挤占位。 */
      transform: scaleX(0.5);
      transform-origin: right center;
    }
    #panel input[type=number]::-webkit-outer-spin-button { display: none; }
    #panel select, #panel input[type=number] { font:inherit; padding:2px 2px; border:1px solid var(--line);
      border-radius:4px; background:#fff; width:96px; }
    #panel input[type=range] { width:100%; }
    #panel table.slots { width:100%; border-collapse:collapse; }
    #panel table.slots th { text-align:left; font-weight:400; color:var(--dim); font-size:11px; padding:1px 2px; }
    #panel table.slots td { padding:1px 2px; }
    #panel table.slots input { width:100%; font:inherit; padding:1px 3px; border:1px solid var(--line);
      border-radius:3px; background:#fff; }
    #panel table.slots td.btn { width:22px; text-align:center; }
    #panel table.slots a { cursor:pointer; color:#900; text-decoration:none; }
    #panel .hr { height:1px; background:var(--line); margin:6px 0; }
    #panel .kv { color:var(--dim); }
    #err { position:fixed; left:10px; bottom:10px; max-width:640px; background:#fff0f0;
      border:1px solid #d33; color:#900; padding:8px 10px; border-radius:6px; display:none; }
  </style>
</head>
<body>
  <div id="view"></div>

  <div id="hud">
    <h1 id="title">Duckov 3D 编辑器 · 加载中…</h1>
    <div class="row" id="views"></div>
    <div class="row" id="meta"></div>
    <div class="row dim" id="hint">拖拽=转 · 滚轮=缩放 · 右键=平移</div>
    <div class="row dim" style="font-size:11px">鸭子身上的挂点（颜色）：
      <b style="color:#ff8a00">枪/近战武器/普通物品</b> ·
      <b style="color:#8a5cff">头盔/耳机</b> ·
      <b style="color:#2fae5a">护甲</b> ·
      <b style="color:#2f7ad2">背包</b> ·
      <b style="color:#d94f8a">面部</b></div>
  </div>

  <div id="panel">
    <h2>物品</h2>
    <label>类型
      <select id="kind">
        <option value="gun">枪</option>
        <option value="melee">近战武器</option>
        <option value="armor">护甲</option>
        <option value="helmat">头盔</option>
        <option value="headset">耳机</option>
        <option value="backpack">背包</option>
        <option value="face">面部</option>
        <option value="item">普通物品</option>
      </select>
    </label>
    <!-- ⭐ 「挂点」这一整节只在需要时露出：pivot 行和握把行都隐藏时，标题也不显示
         （否则会留一个空标题）--> 
    <div id="socketSection">
      <div class="hr"></div>
      <h2>挂点</h2>
      <div class="row" id="pivotRow" style="gap:3px; align-items:center; flex-wrap:nowrap">
        <span style="flex:0 0 auto" title="编辑器坐标 x y z（左右 / 上下 / 前后）。写进 config 时会自动换成 [L,H,D]">pivot xyz</span>
        <input type="number" id="pivot-x" step="0.01" placeholder="X" title="X" style="width:48px; flex:0 0 auto; margin-left:auto">
        <input type="number" id="pivot-y" step="0.01" placeholder="Y" title="Y" style="width:48px; flex:0 0 auto">
        <input type="number" id="pivot-z" step="0.01" placeholder="Z" title="Z" style="width:48px; flex:0 0 auto">
        <span style="flex:0 0 auto">m</span>
      </div>
      <label class="row" id="gripRow" hidden>自动猜握把<input type="checkbox" id="autogrip" checked></label>
    </div>
    <div class="hr"></div>
    <h2>尺寸</h2>
    <label>最长边（米）<input type="number" id="size" step="0.01" min="0.01"></label>
    <label class="kv">当前<b id="curSize">–</b></label>
    <div class="hr"></div>
    <h2>config.json</h2>
    <div class="kv" id="cfgView" style="font-size:11px; white-space:pre-line">读取中……</div>
    <button id="sendBtn" style="width:100%; margin-top:6px; padding:7px 10px; font:inherit; cursor:pointer; border:1px solid var(--line); border-radius:6px; background:var(--btn, #f3f3f3); color:inherit">把结果发给 agent</button>
    <div class="kv dim" id="sendStatus" style="font-size:11px"></div>
    <div class="hr"></div>
    <div class="kv" id="diag">–</div>
  </div>

  <div id="err"></div>

  <script src="three.bundle.js"></script>
  <script src="assets/duck_player.js"></script>
  <script src="editor.js"></script>
</body>
</html>
